name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          python -m pip install -r requirements.txt pyinstaller
          choco install innosetup -y
      - name: Import code-signing certificate
        if: ${{ secrets.SIGN_CERT_PFX_BASE64 != '' }}
        shell: pwsh
        env:
          SIGN_CERT_PFX_BASE64: ${{ secrets.SIGN_CERT_PFX_BASE64 }}
          SIGN_CERT_PASSWORD: ${{ secrets.SIGN_CERT_PASSWORD }}
        run: |
          $bytes = [Convert]::FromBase64String($env:SIGN_CERT_PFX_BASE64)
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, $bytes)
          echo "SIGN_CERT_PFX=$pfx" >> $env:GITHUB_ENV
          echo "SIGN_CERT_PASSWORD=$env:SIGN_CERT_PASSWORD" >> $env:GITHUB_ENV
      - name: Build both products
        shell: pwsh
        run: |
          python packaging\make_icon.py
          $sign = if ($env:SIGN_CERT_PFX) { "-Sign" } else { "" }
          Invoke-Expression ".\packaging\build.ps1 -Product both $sign"
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packaging/output/PluschwoodTallySyncSetup-*.exe
            packaging/output/AutoSyncTallySyncSetup-*.exe
          generate_release_notes: true
